services:
  mongodb:
    image: mongo:7
    container_name: inacademy-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - inacademy-net

  redis:
    image: redis:7-alpine
    container_name: inacademy-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - inacademy-net

  server:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.server
    container_name: inacademy-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/inacademy
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      COOKIE_SECRET: ${COOKIE_SECRET:-cookie-secret}
    depends_on:
      - mongodb
      - redis
    networks:
      - inacademy-net

  client:
    build:
      context: ../client
      dockerfile: ../docker/Dockerfile.client
    container_name: inacademy-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server
    networks:
      - inacademy-net

volumes:
  mongo_data:

networks:
  inacademy-net:
    driver: bridge
